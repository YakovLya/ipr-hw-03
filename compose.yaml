services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT}:${PORT}"
    environment:
      PORT: "${PORT}"
      GREETING: "${GREETING}"
      STORAGE: "${STORAGE}"
      DATA_FILE: "${DATA_FILE}"
      REDIS_URL: "${REDIS_URL}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT}/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
  

  redis: 
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data: